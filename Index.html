<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Refactor | إعادة التشكيل الإدراكي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 24px;
            padding: 16px;
            background: #0f172a;
            border-radius: 8px;
            border-right: 4px solid var(--primary);
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>شفرة | Cognitive Refactor</h1>
        <p class="subtitle">إعادة صياغة الأفكار وتفكيك التشوهات الإدراكية</p>
        
        <textarea id="userInput" placeholder="اكتبي الفكرة التي تؤرقكِ أو الموقف الذي تريدين إعادة تحليله..."></textarea>
        <button onclick="analyzeThought()">إعادة التشكيل والإصلاح</button>

        <div id="resultBox" class="result-box">
            <h3 style="margin-top:0; color: var(--primary);">التحليل والتأطير الجديد:</h3>
            <div id="resultText">جاري المعالجة...</div>
        </div>
    </div>

    <script>
        async function analyzeThought() {
            const input = document.getElementById('userInput').value;
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!input.trim()) {
                alert('يرجى كتابة الفكرة أولاً');
                return;
            }

            resultBox.style.display = 'block';
            resultText.innerText = 'جاري التحليل واستدعاء الذكاء الاصطناعي...';

            try {
                // استدعاء واجهة التعامل مع Gemini API
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ thought: input })
                });

                const data = await response.json();
                if (data.result) {
                    resultText.innerText = data.result;
                } else {
                    resultText.innerText = 'حدث خطأ أثناء معالجة الفكرة، يرجى المحاولة لاحقاً.';
                }
            } catch (err) {
                resultText.innerText = 'ملاحظة: الواجهة جاهزة، وسيعمل التحليل الآلي فور ربط الدالة الخلفية بالكامل.';
            }
        }
    </script>
</body>
</html>
