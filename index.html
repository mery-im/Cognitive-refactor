<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة - الوعي القرآني</title>
    <style>
        :root {
            --bg-color: #f5f2eb;
            --card-bg: #ffffff;
            --primary: #1b4d3e;
            --primary-hover: #14382d; المؤشر
            --text-main: #000000;
            --text-sub: #444444;
            --border: #e2ddd5;
            --accent-soft: #faf9f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            max-width: 540px;
            width: 100%;
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary);
            font-size: 28px;
            margin: 0 0 6px 0;
        }

        .subtitle {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        .app-description {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.7;
            background-color: var(--accent-soft);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 8px;
            text-align: justify;
            min-height: 65px;
        }

        /* مؤشر الكتابة الوامض */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: var(--primary);
            margin-right: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .tags-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            color: var(--text-main);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag {
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag.active, .tag:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 16px;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.8;
        }

        .result-section {
            margin-bottom: 14px;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .result-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quran-verse {
            font-style: italic;
            color: #2c5e4b;
            background-color: #f0ebe1;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 6px 0;
            display: block;
            font-weight: 500;
        }

        .stats-counter {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote-box" id="quoteBox">
            "وإن يمسسك الله بضر فلا كاشف له إلا هو"
        </div>

        <header>
            <h1>شفرة</h1>
            <p class="subtitle">تفكيك الأفكار وتأسيس الوعي القرآني</p>
            <div class="app-description" id="typedDescription">
                <span class="cursor"></span>
            </div>
        </header>
        
        <span class="tags-label">اختر طبيعة الشعور أو الفكرة:</span>
        <div class="tags-container">
            <span class="tag" onclick="toggleTag(this)">قلق المستقبل</span>
            <span class="tag" onclick="toggleTag(this)">ظن وسوء تفاهم</span>
            <span class="tag" onclick="toggleTag(this)">عجز وضغط نفسي</span>
            <span class="tag" onclick="toggleTag(this)">شعور باليأس والتهويل</span>
        </div>

        <textarea id="userInput" placeholder="اكتب الفكرة، الموقف، أو الشعور الذي يشغل بالك هنا..."></textarea>
        
        <button id="submitBtn" onclick="processIdea()">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">تأسيس الوعي وإيجاد الحل العملي</span>
        </button>

        <div class="result" id="resultBox">
            <div class="result-section">
                <div class="result-title">1. تأصيل الفكرة من الوعي القرآني:</div>
                <div id="quranRoot"></div>
            </div>
            
            <div class="result-section">
                <div class="result-title">2. التفكيك المعرفي وإعادة التأطير:</div>
                <div id="reframingText"></div>
            </div>

            <div class="result-section">
                <div class="result-title">3. الحل العملي المستنبط:</div>
                <div id="practicalSolution"></div>
            </div>
        </div>

        <div class="stats-counter">
            <span>الأفكار المُعالجة اليوم:</span>
            <span class="counter-badge" id="ideaCount">0</span>
        </div>
    </div>

    <script>
        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        // تأثير الكتابة حرفاً حرفاً للنص التعريفي عند فتح الصفحة
        const textToType = "مساحة تفاعلية لإعادة بناء طريقة التفكير وإعادة التأطير الوجداني والمعرفي للأفكار والمشكلات، بالاستناد إلى بصائر الوعي القرآني، وتحويل الضغوط والمخاوف إلى رؤية واضحة وحلول عملية مبسطة تجلب السكينة والطمأنينة.";
        const typedContainer = document.getElementById('typedDescription');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                // إدراج الحرف قبل مؤشر الكتابة
                const cursor = typedContainer.querySelector('.cursor');
                const textNode = document.createTextNode(textToType.charAt(charIndex));
                typedContainer.insertBefore(textNode, cursor);
                charIndex++;
                setTimeout(typeWriter, 25); // سرعة الكتابة (كلما قل الرقم زادت السرعة)
            } else {
                // إزالة المؤشر بعد انتهاء الكتابة تماماً
                const cursor = typedContainer.querySelector('.cursor');
                if (cursor) cursor.remove();
            }
        }

        // بدء التأثير بعد تحميل الصفحة بقليل
        window.onload = function() {
            setTimeout(typeWriter, 400);
        };

        function toggleTag(element) {
            element.classList.toggle('active');
        }

        function processIdea() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const activeTag = document.querySelector('.tag.active');
            const tagText = activeTag ? activeTag.innerText : 'الوعي العام';

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            
            const quranRoot = document.getElementById('quranRoot');
            const reframingText = document.getElementById('reframingText');
            const practicalSolution = document.getElementById('practicalSolution');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري استجلاء الوعي القرآني واستنباط الحل...';
            resultBox.style.display = 'none';

            setTimeout(() => {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'تأسيس الوعي وإيجاد الحل العملي';
                
                quranRoot.innerHTML = `هذه الفكرة (${input}) تتعلق بـ (${tagText}). يخبرنا القرآن الكريم أن الخواطر التي تُقلق الإنسان غالباً ما تنبع من استباق الأقدار أو تضخيم المخاوف، وكما قال تعالى: <span class="quran-verse">"إن الظن لا يغني من الحق شيئاً"</span>، فالقلب حين يغفل عن اليقين يستوحش من الظنون.`;

                reframingText.innerHTML = `عقلك يتعامل مع فكرتك الحالية على أنها مأزق نهائي أو تهديد حقيقي، بينما هي في ميزان القرآن مجرد اختبار مؤقت أو "ابتلاء تقدير" لحكمة بالغة. الله سبحانه وتعالى لا يُحمل نفساً فوق وسعها، وما يبدو لك عقبة صعبة هو مسار إرساء للثقة والتوكل.`;

                practicalSolution.innerHTML = `<strong>الخطوة العملية:</strong> حرر مشاعرك من السيطرة الوهمية عبر تفويض الأمر (التوكل الفعلي)، وقسّم التحدي إلى عمل يومي صغير ومحدد، واردد بقلبك يقين الآية: <span class="quran-verse">"حسبي الله لا إله إلا هو عليه توكلت"</span> مع التركيز فقط على ما يقع ضمن قدرتك وصلاحيتك اليوم.`;

                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
            }, 1000);
        }
    </script>

</body>
    </html>
