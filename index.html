<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px 20px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(45, 90, 76, 0.06);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        @media (min-width: 768px) {
            .container {
                padding: 40px 36px;
            }
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary);
            font-size: 28px;
            margin: 0 0 4px 0;
            font-weight: 700;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 32px;
            }
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        .app-description {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.7;
            background-color: var(--accent-soft);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 10px;
            text-align: justify;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: var(--primary);
            margin-right: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 16px;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 24px;
            padding: 18px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.8;
            box-sizing: border-box;
            white-space: pre-line;
        }

        .footer-note {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote-box" id="quoteBox">
            "وإن يمسسك الله بضر فلا كاشف له إلا هو"
        </div>

        <header>
            <h1>شفرة</h1>
            <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
            <div class="app-description" id="typedDescription">
                <span class="cursor"></span>
            </div>
        </header>

        <textarea id="userInput" placeholder="اكتب الفكرة، الموقف، أو الشعور الذي يشغل بالك هنا بكلمات بسيطة..."></textarea>
        
        <button id="submitBtn" onclick="processIdea()">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">ترتيب الفكرة وإيجاد الحل العملي</span>
        </button>

        <div class="result" id="resultBox"></div>

        <div class="footer-note">
            <span>تطبيق <span class="brand-name">شفرة 🌿</span></span>
            <div>الأفكار المعالجة: <span class="counter-badge" id="ideaCount">0</span></div>
        </div>
    </div>

    <script>
        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        const textToType = "مساحة آمنة ومبسطة لمساعدة عقلك على ترتيب أفكاره، فهم مشاعره بطريقة هادئة، وتحويل الضغوط والقلق إلى خطوات عملية واضحة تمنحك الطمأنينة وراحة البال.";
        const typedContainer = document.getElementById('typedDescription');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                const cursor = typedContainer.querySelector('.cursor');
                const textNode = document.createTextNode(textToType.charAt(charIndex));
                typedContainer.insertBefore(textNode, cursor);
                charIndex++;
                setTimeout(typeWriter, 25);
            } else {
                const cursor = typedContainer.querySelector('.cursor');
                if (cursor) cursor.remove();
            }
        }

        window.onload = function() {
            setTimeout(typeWriter, 400);
        };

        async function processIdea() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري التفكير وتحليل الفكرة...';
            resultBox.style.display = 'none';

            // استبدل YOUR_API_KEY بمفتاح الـ API الفعلي الخاص بك هنا
            const apiKey = "AQ.Ab8RN6LYw9ieC6WWihdYOrKviZkToz4fNOnRkT1WjwSFv-aixA"; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const systemInstruction = "أنت مساعد فكري ومعرفي مستوحى من الفكر النقدي وبصائر الدكتور نايف بن نهار. مهمتك هي: تفكيك الأفكار والأسئلة التي يطرحها المستخدم، كشف الخلفيات والتناقضات المعرفية إن وجدت، تقديم تحليل عقلي رصين وعميق، وصياغة حل عملي مبسط ومفهوم لكل الناس دون تعقيد. اجعل الإجابة مرتبة ومنسقة في نقاط واضحة.";

            const data = {
                contents: [
                    {
                        parts: [
                            { text: systemInstruction + "\n\nفكرة المستخدم أو شعوره هو: " + input }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                const reply = resData.candidates[0].content.parts[0].text;

                resultBox.innerText = reply;
                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
            } catch (error) {
                resultBox.innerText = "حدث خطأ أثناء الاتصال أو المفتاح غير مدخل بشكل صحيح. يرجى التأكد من مفتاح الـ API.";
                resultBox.style.display = 'block';
            } finally {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'ترتيب الفكرة وإيجاد الحل العملي';
            }
        }
    </script>

</body>
</html>
