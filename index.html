<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 820px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background-color: var(--card-bg);
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 4px solid var(--primary);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 6px 0;
        }

        h1 {
            color: var(--primary);
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .app-description {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.7;
            background-color: var(--accent-soft);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: justify;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        button.action-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result {
            padding: 18px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.8;
            white-space: pre-line;
            font-size: 15px;
            direction: auto;
        }

        .footer-note {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote-box" id="quoteBox">
            "وإن يمسسك الله بضر فلا كاشف له إلا هو"
        </div>

        <header>
            <h1>شفرة</h1>
            <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
            <div class="app-description">
                مساحة آمنة ومبسطة لمساعدة العقل على ترتيب أفكاره، فهم مشاعره بعمق وهدوء، وتحويل الضغوط إلى خطوات عملية واضحة.
            </div>
        </header>

        <!-- منطقة الكتابة وزر الإرسال -->
        <div class="input-group">
            <textarea id="userInput" placeholder="اكتب الفكرة، الموقف، أو الشعور الذي يشغل بالك هنا..."></textarea>
            
            <button class="action-btn" id="submitBtn" onclick="processIdea()">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">ترتيب الفكرة وإيجاد الحل العملي</span>
            </button>
        </div>

        <!-- صندوق النتيجة -->
        <div class="result" id="resultBox"></div>

        <!-- الفوتر -->
        <div class="footer-note">
            <span class="brand-name">شفرة 🌿</span>
            <div>المعالجة: <span class="counter-badge" id="ideaCount">0</span></div>
        </div>
    </div>

    <script>
        // المفتاح المدمج مباشرة
        const apiKey = "AQ.Ab8RN6KWFN77T1ZFiL-2i2MvfBHrVOYs0ftBA08tPBs5ZGryDQ";

        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        async function processIdea() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري التفكير وتحليل الفكرة...';
            resultBox.style.display = 'none';

            // التحديث الجذري: استخدام مسار الإصدار الحديث v1 والنموذج النشط gemini-2.5-flash
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const systemInstruction = "أنت مساعد فكري ومعرفي مستوحى من الفكر النقدي وبصائر الدكتور نايف بن نهار. مهمتك هي: تفكيك الأفكار والأسئلة التي يطرحها المستخدم، كشف الخلفيات والتناقضات المعرفية إن وجدت، تقديم تحليل عقلي رصين وعميق، وصياغة حل عملي مبسط ومفهوم لكل الناس دون تعقيد. اجعل الإجابة مرتبة ومنسقة في نقاط واضحة.";

            const data = {
                contents: [
                    {
                        parts: [
                            { text: systemInstruction + "\n\nفكرة المستخدم أو شعوره هو: " + input }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                
                if (!response.ok || resData.error) {
                    throw new Error(resData.error ? resData.error.message : 'خطأ في الاستجابة (' + response.status + ')');
                }

                const reply = resData.candidates[0].content.parts[0].text;

                resultBox.innerText = reply;
                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
                
                resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (error) {
                resultBox.innerText = "⚠️ تعذر الحصول على إجابة:\n" + error.message;
                resultBox.style.display = 'block';
            } finally {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'ترتيب الفكرة وإيجاد الحل العملي';
            }
        }
    </script>

</body>
</html>
