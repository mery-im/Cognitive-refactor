<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--card-bg);
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            background-color: var(--card-bg);
        }

        @media (min-width: 768px) {
            body {
                background-color: var(--bg-color);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .container {
                max-width: 700px;
                height: 94vh;
                max-height: 850px;
                border-radius: 20px;
                box-shadow: 0 10px 35px rgba(45, 90, 76, 0.08);
                border: 1px solid var(--border);
                padding: 30px;
                background-color: var(--card-bg);
            }
        }

        .scrollable-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            flex-shrink: 0;
        }

        header {
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .app-description {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
            background-color: var(--accent-soft);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: justify;
        }

        .api-settings {
            display: flex;
            gap: 8px;
            background: var(--accent-soft);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
            flex-shrink: 0;
        }

        .api-settings input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #ffffff;
        }

        .api-settings button {
            flex-shrink: 0;
            padding: 8px 14px;
            font-size: 13px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            background: var(--card-bg);
            padding-top: 5px;
        }

        textarea {
            width: 100%;
            height: 85px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        button.action-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result {
            padding: 14px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.7;
            white-space: pre-line;
            font-size: 13px;
            margin-top: 8px;
        }

        .footer-note {
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .key-toggle {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            font-family: inherit;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الجزء القابل للتمرير (الأعلى) -->
        <div class="scrollable-area" id="scrollArea">
            <div class="quote-box" id="quoteBox">
                "وإن يمسسك الله بضر فلا كاشف له إلا هو"
            </div>

            <header>
                <h1>شفرة</h1>
                <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
                <div class="app-description">
                    مساحة آمنة ومبسطة لمساعدة عقلك على ترتيب أفكاره، فهم مشاعره بعمق وهدوء، وتحويل الضغوط إلى خطوات عملية واضحة.
                </div>
            </header>

            <!-- شريط المفتاح (يختفي بعد الحفظ) -->
            <div class="api-settings" id="apiSettingsBar">
                <input type="password" id="apiKeyInput" placeholder="مفتاح Google AI Studio...">
                <button onclick="saveApiKey()">حفظ</button>
            </div>

            <div class="result" id="resultBox"></div>
        </div>

        <!-- الجزء الثابت في الأسفل (صندوق الكتابة وزر الإرسال) -->
        <div class="input-section">
            <textarea id="userInput" placeholder="اكتب الفكرة، الموقف، أو الشعور الذي يشغل بالك..."></textarea>
            
            <button class="action-btn" id="submitBtn" onclick="processIdea()">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">ترتيب الفكرة وإيجاد الحل العملي</span>
            </button>
        </div>

        <!-- الفوتر -->
        <div class="footer-note">
            <span><span class="brand-name">شفرة 🌿</span> | <button class="key-toggle" onclick="toggleKeyBar()">المفتاح 🔑</button></span>
            <div>المعالجة: <span class="counter-badge" id="ideaCount">0</span></div>
        </div>
    </div>

    <script>
        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('apiSettingsBar').style.display = 'none';
            }
        };

        function toggleKeyBar() {
            const bar = document.getElementById('apiSettingsBar');
            bar.style.display = (bar.style.display === 'none') ? 'flex' : 'none';
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('apiSettingsBar').style.display = 'none';
                alert('تم حفظ المفتاح بنجاح!');
            } else {
                alert('يرجى لصق المفتاح أولاً.');
            }
        }

        async function processIdea() {
            let apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            
            if (!apiKey) {
                alert('يرجى إدخال مفتاح الـ API وحفظه أولاً.');
                document.getElementById('apiSettingsBar').style.display = 'flex';
                return;
            }

            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري التفكير وتحليل الفكرة...';
            resultBox.style.display = 'none';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const systemInstruction = "أنت مساعد فكري ومعرفي مستوحى من الفكر النقدي وبصائر الدكتور نايف بن نهار. مهمتك هي: تفكيك الأفكار والأسئلة التي يطرحها المستخدم، كشف الخلفيات والتناقضات المعرفية إن وجدت، تقديم تحليل عقلي رصين وعميق، وصياغة حل عملي مبسط ومفهوم لكل الناس دون تعقيد. اجعل الإجابة مرتبة ومنسقة في نقاط واضحة.";

            const data = {
                contents: [
                    {
                        parts: [
                            { text: systemInstruction + "\n\nفكرة المستخدم أو شعوره هو: " + input }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                
                if (resData.error) {
                    throw new Error(resData.error.message);
                }

                const reply = resData.candidates[0].content.parts[0].text;

                resultBox.innerText = reply;
                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
                
                // التمرير لرؤية النتيجة بوضوح
                const scrollArea = document.getElementById('scrollArea');
                scrollArea.scrollTop = scrollArea.scrollHeight;
            } catch (error) {
                resultBox.innerText = "حدث خطأ في الاتصال أو أن مفتاح الـ API غير صحيح. يرجى التأكد من المفتاح.";
                resultBox.style.display = 'block';
                document.getElementById('apiSettingsBar').style.display = 'flex';
            } finally {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'ترتيب الفكرة وإيجاد الحل العملي';
            }
        }
    </script>

</body>
                    </html>
