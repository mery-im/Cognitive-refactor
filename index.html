<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            height: 100vh;
            max-width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 750px;
                height: 90vh;
                max-height: 850px;
                border-radius: 20px;
                box-shadow: 0 10px 35px rgba(45, 90, 76, 0.08);
                border: 1px solid var(--border);
                padding: 30px 40px;
            }
        }

        .top-section {
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 10px;
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin: 0 0 2px 0;
            font-weight: 700;
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .app-description {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.6;
            background-color: var(--accent-soft);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: justify;
        }

        .api-settings {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            background: var(--accent-soft);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
            font-size: 12px;
        }

        .api-settings input {
            flex-grow: 1;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            background: #fff;
        }

        .api-settings button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 12px;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button.action-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 14px;
            padding: 14px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.8;
            box-sizing: border-box;
            white-space: pre-line;
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
        }

        .footer-note {
            margin-top: 10px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-section">
            <div class="quote-box" id="quoteBox">
                "وإن يمسسك الله بضر فلا كاشف له إلا هو"
            </div>

            <header>
                <h1>شفرة</h1>
                <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
                <div class="app-description" id="typedDescription">مساحة آمنة ومبسطة لمساعدة عقلك على ترتيب أفكاره وفهم مشاعره بعمق وهدوء.</div>
            </header>

            <!-- إعدادات المفتاح السرية والآمنة محلياً -->
            <div class="api-settings" id="apiSettingsBar">
                <span id="apiKeyLabel">مفتاح API:</span>
                <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Google AI Studio هنا...">
                <button class="action-btn" onclick="saveApiKey()">حفظ</button>
            </div>

            <textarea id="userInput" placeholder="اكتب الفكرة، الموقف، أو الشعور الذي يشغل بالك هنا بكلمات بسيطة..."></textarea>
            
            <button class="action-btn" id="submitBtn" onclick="processIdea()">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">ترتيب الفكرة وإيجاد الحل العملي</span>
            </button>

            <div class="result" id="resultBox"></div>
        </div>

        <div class="footer-note">
            <span>تطبيق <span class="brand-name">شفرة 🌿</span></span>
            <div>الأفكار المعالجة: <span class="counter-badge" id="ideaCount">0</span></div>
        </div>
    </div>

    <script>
        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        // التحقق مما إذا كان المفتاح مخزناً مسبقاً في المتصفح
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('apiKeyBar').style.display = 'none'; // إخفاء الشريط إذا كان المفتاح محفوظاً
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('تم حفظ المفتاح بنجاح في متصفحك!');
                document.getElementById('apiKeyBar').style.display = 'none';
            } else {
                alert('يرجى إدخال مفتاح صالح.');
            }
        }

        async function processIdea() {
            let apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            
            if (!apiKey) {
                alert('يرجى إدخال مفتاح الـ API الخاص بـ Google AI Studio في الخانة المخصصة أولاً.');
                document.getElementById('apiKeyBar').style.display = 'flex';
                return;
            }

            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري التفكير وتحليل الفكرة...';
            resultBox.style.display = 'none';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const systemInstruction = "أنت مساعد فكري ومعرفي مستوحى من الفكر النقدي وبصائر الدكتور نايف بن نهار. مهمتك هي: تفكيك الأفكار والأسئلة التي يطرحها المستخدم، كشف الخلفيات والتناقضات المعرفية إن وجدت، تقديم تحليل عقلي رصين وعميق، وصياغة حل عملي مبسط ومفهوم لكل الناس دون تعقيد. اجعل الإجابة مرتبة ومنسقة في نقاط واضحة.";

            const data = {
                contents: [
                    {
                        parts: [
                            { text: systemInstruction + "\n\nفكرة المستخدم أو شعوره هو: " + input }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                
                if (resData.error) {
                    throw new Error(resData.error.message);
                }

                const reply = resData.candidates[0].content.parts[0].text;

                resultBox.innerText = reply;
                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
            } catch (error) {
                resultBox.innerText = "حدث خطأ في الاتصال أو أن مفتاح الـ API غير صحيح. يرجى التأكد من المفتاح.";
                resultBox.style.display = 'block';
                document.getElementById('apiKeyBar').style.display = 'flex'; // إظهار خانة المفتاح مجدداً للتعديل
            } finally {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'ترتيب الفكرة وإيجاد الحل العملي';
            }
        }
    </script>

</body>
    </html>
