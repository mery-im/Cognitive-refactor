<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .container {
            background-color: var(--card-bg);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 650px;
                height: 90vh;
                max-height: 800px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(45, 90, 76, 0.08);
                border: 1px solid var(--border);
                padding: 24px;
            }
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 8px;
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-sub);
        }

        header {
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .app-description {
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.4;
            background-color: var(--accent-soft);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: justify;
        }

        .api-settings {
            display: flex;
            gap: 6px;
            background: var(--accent-soft);
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            align-items: center;
        }

        .api-settings input {
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            background: #ffffff;
        }

        .api-settings button {
            padding: 6px 12px;
            font-size: 12px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        /* صندوق الإدخال وزر الإرسال مثبتان معاً بالأسفل لضمان عدم اختفائهما */
        .bottom-panel {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--card-bg);
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        button.action-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result {
            padding: 10px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.6;
            white-space: pre-line;
            font-size: 12px;
        }

        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-sub);
            padding-top: 4px;
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .key-toggle {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 10px;
            cursor: pointer;
            text-decoration: underline;
            font-family: inherit;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: bold;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الأجزاء العلوية القابلة للتمرير -->
        <div class="content-area" id="contentArea">
            <div class="quote-box" id="quoteBox">
                "وإن يمسسك الله بضر فلا كاشف له إلا هو"
            </div>

            <header>
                <h1>شفرة</h1>
                <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
                <div class="app-description">
                    مساحة آمنة ومبسطة لمساعدة عقلك على ترتيب أفكاره، فهم مشاعره بعمق، وتحويل الضغوط إلى خطوات عملية واضحة.
                </div>
            </header>

            <!-- شريط المفتاح (يختفي بعد الحفظ ويمكن إظهاره من الفوتر) -->
            <div class="api-settings" id="apiSettingsBar">
                <input type="password" id="apiKeyInput" placeholder="مفتاح Google AI Studio...">
                <button onclick="saveApiKey()">حفظ</button>
            </div>

            <div class="result" id="resultBox"></div>
        </div>

        <!-- لوحة الإدخال والزر (مثبتة في الأسفل تماماً ولا تختفي أبداً) -->
        <div class="bottom-panel">
            <textarea id="userInput" placeholder="اكتب الفكرة أو الشعور هنا..."></textarea>
            
            <button class="action-btn" id="submitBtn" onclick="processIdea()">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">ترتيب الفكرة وإيجاد الحل العملي</span>
            </button>

            <div class="footer-note">
                <span><span class="brand-name">شفرة 🌿</span> | <button class="key-toggle" onclick="toggleKeyBar()">المفتاح 🔑</button></span>
                <div>المعالجة: <span class="counter-badge" id="ideaCount">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('apiSettingsBar').style.display = 'none';
            }
        };

        function toggleKeyBar() {
            const bar = document.getElementById('apiSettingsBar');
            bar.style.display = (bar.style.display === 'none') ? 'flex' : 'none';
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('apiSettingsBar').style.display = 'none';
                alert('تم حفظ المفتاح بنجاح!');
            } else {
                alert('يرجى لصق المفتاح أولاً.');
            }
        }

        async function processIdea() {
            let apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            
            if (!apiKey) {
                alert('يرجى إدخال مفتاح الـ API وحفظه أولاً.');
                document.getElementById('apiSettingsBar').style.display = 'flex';
                return;
            }

            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري التفكير...';
            resultBox.style.display = 'none';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const systemInstruction = "أنت مساعد فكري ومعرفي مستوحى من الفكر النقدي وبصائر الدكتور نايف بن نهار. مهمتك هي: تفكيك الأفكار والأسئلة التي يطرحها المستخدم، كشف الخلفيات والتناقضات المعرفية إن وجدت، تقديم تحليل عقلي رصين وعميق، وصياغة حل عملي مبسط ومفهوم لكل الناس دون تعقيد. اجعل الإجابة مرتبة ومنسقة في نقاط واضحة.";

            const data = {
                contents: [
                    {
                        parts: [
                            { text: systemInstruction + "\n\nفكرة المستخدم أو شعوره هو: " + input }
                        ]
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                
                if (resData.error) {
                    throw new Error(resData.error.message);
                }

                const reply = resData.candidates[0].content.parts[0].text;

                resultBox.innerText = reply;
                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
                
                const contentArea = document.getElementById('contentArea');
                contentArea.scrollTop = contentArea.scrollHeight;
            } catch (error) {
                resultBox.innerText = "حدث خطأ في الاتصال أو أن مفتاح الـ API غير صحيح. يرجى التأكد من المفتاح.";
                resultBox.style.display = 'block';
                document.getElementById('apiSettingsBar').style.display = 'flex';
            } finally {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'ترتيب الفكرة وإيجاد الحل العملي';
            }
        }
    </script>

</body>
</html>
