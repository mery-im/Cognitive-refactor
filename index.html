<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            height: 100vh;
            max-width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 750px;
                height: 90vh;
                max-height: 850px;
                border-radius: 20px;
                box-shadow: 0 10px 35px rgba(45, 90, 76, 0.08);
                border: 1px solid var(--border);
                padding: 30px 40px;
            }
        }

        .top-section {
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 10px;
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin: 0 0 2px 0;
            font-weight: 700;
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .app-description {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.6;
            background-color: var(--accent-soft);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: justify;
        }

        .api-settings {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            background: var(--accent-soft);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
            font-size: 12px;
        }

        .api-settings input {
            flex-grow: 1;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            background: #fff;
        }

        .api-settings button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 12px;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button.action-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 14px;
            padding: 14px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.8;
            box-sizing: border-box;
            white-space: pre-line;
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
        }

        .footer-note {
            margin-top: 10px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

        <div class="top-section">
            <div class="quote-box" id="quoteBox">
                "وإن يمسسك الله بضر فلا كاشف له إلا هو"
            </div>

            <header>
                <h1>شفرة</h1>
                <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
                <div class="app-description" id="typedDescription">مساحة آمنة ومبسطة لمساعدة عقلك على ترتيب أفكاره وفهم مشاعره بعمق وهدوء.</div>
