<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة</title>
    <style>
        :root {
            --bg-color: #f5f2eb;
            --card-bg: #ffffff;
            --primary: #1b4d3e;
            --primary-hover: #14382d;
            --text-main: #000000;
            --text-sub: #444444;
            --border: #e2ddd5;
            --accent-soft: #faf9f6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            max-width: 520px;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* اقتباس حيوي ترحيبي */
        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin: 0;
        }

        /* أوسمة تصنيف التشوه الإدراكي */
        .tags-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            color: var(--text-main);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag {
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag.active, .tag:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 16px;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        /* الزر التفاعلي */
        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        /* بطاقة النتيجة والعداد */
        .result {
            margin-top: 24px;
            padding: 18px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .result-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stats-counter {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- حكمة عشوائية لتجديد الطاقة -->
        <div class="quote-box" id="quoteBox">
            "الأفكار ليست حقائق، بل هي مجرد اقتراحات يقدمها عقلك."
        </div>

        <header>
            <h1>شفرة</h1>
            <p class="subtitle">إعادة صياغة الأفكار وتفكيك التشوهات الإدراكية</p>
        </header>
        
        <!-- أوسمة اختيار نوع التشوه الإدراكي -->
        <span class="tags-label">اختر نمط التفكير (اختياري):</span>
        <div class="tags-container">
            <span class="tag" onclick="toggleTag(this)">تهويل الأمور</span>
            <span class="tag" onclick="toggleTag(this)">التعميم المطلق</span>
            <span class="tag" onclick="toggleTag(this)">لوم الذات</span>
            <span class="tag" onclick="toggleTag(this)">التفكير الأسرى (أبيض/أسود)</span>
        </div>

        <textarea id="userInput" placeholder="اكتب الفكرة أو الموقف الذي يشغل بالك هنا..."></textarea>
        
        <button id="submitBtn" onclick="processIdea()">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">إعادة التشكيل والإصلاح</span>
        </button>

        <!-- بطاقة النتيجة التفاعلية -->
        <div class="result" id="resultBox">
            <div class="result-title">التحليل والتأطير الجديد:</div>
            <p id="resultText" style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-main);"></p>
        </div>

        <!-- عداد الأفكار المعاد صياغتها -->
        <div class="stats-counter">
            <span>الأفكار المُعاد تشكيلها اليوم:</span>
            <span class="counter-badge" id="ideaCount">0</span>
        </div>
    </div>
