<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة - الوعي والتوجيه</title>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --primary: #2d5a4c;
            --primary-hover: #224438;
            --accent-green: #4a7c59;
            --text-main: #2c3531;
            --text-sub: #555e58;
            --border: #e3dec9;
            --accent-soft: #f2efe4;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px 20px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(45, 90, 76, 0.06);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        @media (min-width: 768px) {
            .container {
                padding: 40px 36px;
            }
        }

        .quote-box {
            background-color: var(--accent-soft);
            border-right: 3px solid var(--primary);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary);
            font-size: 28px;
            margin: 0 0 4px 0;
            font-weight: 700;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 32px;
            }
        }

        .subtitle {
            color: var(--accent-green);
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        .app-description {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.7;
            background-color: var(--accent-soft);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 10px;
            text-align: justify;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: var(--primary);
            margin-right: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .tags-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            color: var(--text-main);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag {
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag.active, .tag:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 16px;
            background-color: var(--accent-soft);
            color: var(--text-main);
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 24px;
            padding: 18px;
            background-color: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: right;
            color: var(--text-main);
            display: none;
            line-height: 1.8;
            box-sizing: border-box;
        }

        .result-section {
            margin-bottom: 14px;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .result-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quran-verse {
            font-style: italic;
            color: #3b6e5d;
            background-color: #e9e5d4;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 6px 0;
            display: block;
            font-weight: 500;
        }

        .footer-note {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
        }

        .brand-name {
            color: var(--primary);
            font-weight: bold;
        }

        .counter-badge {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote-box" id="quoteBox">
            "وإن يمسسك الله بضر فلا كاشف له إلا هو"
        </div>

        <header>
            <h1>شفرة</h1>
            <p class="subtitle">تفكيك الأفكار وترتيب الوجهة</p>
            <div class="app-description" id="typedDescription">
                <span class="cursor"></span>
            </div>
        </header>
        
        <span class="tags-label">اختر طبيعة الشعور أو الفكرة:</span>
        <div class="tags-container">
            <span class="tag" onclick="toggleTag(this)">قلق المستقبل</span>
            <span class="tag" onclick="toggleTag(this)">سوء تفاهم أو ظن</span>
            <span class="tag" onclick="toggleTag(this)">عجز وضغط نفسي</span>
            <span class="tag" onclick="toggleTag(this)">شعور باليأس والتهويل</span>
        </div>

        <textarea id="userInput" placeholder="اكتب الفكرة، الموقف، أو الشعور الذي يشغل بالك هنا بكلمات بسيطة..."></textarea>
        
        <button id="submitBtn" onclick="processIdea()">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">ترتيب الفكرة وإيجاد الحل العملي</span>
        </button>

        <div class="result" id="resultBox">
            <div class="result-section">
                <div class="result-title">1. البوصلة القرآنية:</div>
                <div id="quranRoot"></div>
            </div>
            
            <div class="result-section">
                <div class="result-title">2. نظرة هادئة للأمر:</div>
                <div id="reframingText"></div>
            </div>

            <div class="result-section">
                <div class="result-title">3. خطوتك العملية القادمة:</div>
                <div id="practicalSolution"></div>
            </div>
        </div>

        <div class="footer-note">
            <span>تطبيق <span class="brand-name">شفرة 🌿</span></span>
            <div>الأفكار المعالجة: <span class="counter-badge" id="ideaCount">0</span></div>
        </div>
    </div>

    <script>
        const quotes = [
            "\"وإن يمسسك الله بضر فلا كاشف له إلا هو\"",
            "\"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه\"",
            "\"إن مع العسر يسرا\"",
            "\"ألا بذكر الله تطمئن القلوب\""
        ];

        let count = 0;
        document.getElementById('quoteBox').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        const textToType = "مساحة آمنة ومبسطة لمساعدة عقلك على ترتيب أفكاره، فهم مشاعره بطريقة هادئة، وتحويل الضغوط والقلق إلى خطوات عملية واضحة تمنحك الطمأنينة وراحة البال.";
        const typedContainer = document.getElementById('typedDescription');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                const cursor = typedContainer.querySelector('.cursor');
                const textNode = document.createTextNode(textToType.charAt(charIndex));
                typedContainer.insertBefore(textNode, cursor);
                charIndex++;
                setTimeout(typeWriter, 25);
            } else {
                const cursor = typedContainer.querySelector('.cursor');
                if (cursor) cursor.remove();
            }
        }

        window.onload = function() {
            setTimeout(typeWriter, 400);
        };

        function toggleTag(element) {
            element.classList.toggle('active');
        }

        function processIdea() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('يرجى كتابة الفكرة أو الشعور أولاً.');
                return;
            }

            const activeTag = document.querySelector('.tag.active');
            const tagText = activeTag ? activeTag.innerText : 'الوعي العام';

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            
            const quranRoot = document.getElementById('quranRoot');
            const reframingText = document.getElementById('reframingText');
            const practicalSolution = document.getElementById('practicalSolution');
            const counter = document.getElementById('ideaCount');

            btnSpinner.style.display = 'inline-block';
            btnText.innerText = 'جاري ترتيب الأفكار...';
            resultBox.style.display = 'none';

            setTimeout(() => {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'ترتيب الفكرة وإيجاد الحل العملي';
                
                quranRoot.innerHTML = `حين نشعر بـ (${tagText}) تجاه ما كتبته ("${input}")، يذكرنا القرآن الكريم أن الأمور كلها بيد الله وحده، وأن القلق لا يغير شيئاً من الواقع بل يزيد التعب، كما قال تعالى: <span class="quran-verse">"ما أصاب من مصيبة إلا بإذن الله ومن يؤمن بالله يهدي قلبه"</span>.`;

                reframingText.innerHTML = `غالباً ما نعطي الأمور أكبرz من حجمها الحقيقي أو نتخيل الأسوأ قبل أن يحدث. الواقع أبسط بكثير، والمشكلة التي تقلقك اليوم هي مجرد مرحلة مؤقتة وستبدو أصغر بكثير حين تنظر إليها لاحقاً.`;

                practicalSolution.innerHTML = `<strong>الخطوة البسيطة:</strong> ركز فقط على ما يمكنك فعله اليوم، واترك ما لا تملك السيطرة عليه. خذ نفساً عميقاً، وردد بقلب هادئ: <span class="quran-verse">"حسبي الله ونعم الوكيل"</span>، وابدأ بأبسط خطوة عملية تناسب قدرتك الآن.`;

                resultBox.style.display = 'block';
                count++;
                counter.innerText = count;
            }, 1000);
        }
    </script>

</body>
        </html>
